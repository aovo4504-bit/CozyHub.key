<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cozy Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
    body {
        margin:0;
        background:#050811;
        font-family:'Poppins',sans-serif;
        overflow:hidden;
    }
    .bg-dots {
        position:fixed; inset:0;
        background:url('https://i.ibb.co/0j1zV42/dots.gif');
        opacity:0.25;
        z-index:-1;
    }
    .card {
        width:420px;
        margin:90px auto;
        padding:35px;
        background:rgba(7,11,20,0.9);
        border-radius:25px;
        text-align:center;
        color:white;
        box-shadow:0 0 40px #00eaff;
    }
    .logo {
        width:120px;height:120px;
        margin:0 auto 20px;
        background:url('https://raw.githubusercontent.com/aovo4504-bit/Cozyhub/refs/heads/main/IMG_0830.png') center/cover;
        border-radius:50%;
        box-shadow:0 0 25px #00eaff;
    }
    .btn {
        width:100%;padding:15px;
        margin-top:20px;
        font-size:18px;
        font-weight:600;
        color:#001015;
        background:#00eaff;
        border:none;border-radius:12px;
        cursor:pointer;
        transition:0.2s;
    }
    .btn:hover { transform:scale(1.05); }
    .icons img {
        width:48px;
        margin:18px 12px;
        filter:drop-shadow(0 0 10px #00eaff);
        cursor:pointer;
    }
</style>

<script>
//==================== AUTO LANGUAGE ====================//
let langRaw = (navigator.language || "en").toLowerCase();
let lang = langRaw.startsWith("vi") ? "vi" : "en";

const TEXT = {
  title: { en:"Cozy Hub", vi:"Cozy Hub" },
  sub:   { en:"Click below to complete missions and get your key.", vi:"Bấm nút bên dưới để làm nhiệm vụ và nhận Key." },
  get:   { en:"Get Key", vi:"Nhận Key" }
};

//==================== RESET TASK 10 MIN ====================//
(function resetTask(){
    const last = localStorage.getItem("cozy_task_done_at");
    if(last){
        const diff = Date.now() - Number(last);
        if(diff >= 10 * 60 * 1000){
            localStorage.removeItem("cozy_task1");
            localStorage.removeItem("cozy_task2");
            localStorage.removeItem("cozy_task_done_at");
        }
    }
})();
</script>
</head>

<body>
<div class="bg-dots"></div>

<div class="card">
    <div class="logo"></div>
    <h1 id="title"></h1>
    <p id="sub"></p>

    <button class="btn" onclick="startFlow()" id="startBtn">Get Key</button>

    <div class="icons">
        <a href="https://www.youtube.com/@VoAo-v2g"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>
        <a href="https://www.tiktok.com/@cozyhub15"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"></a>
        <a href="https://discord.com"><img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png"></a>
    </div>
</div>

<script>
document.getElementById("title").textContent = TEXT.title[lang];
document.getElementById("sub").textContent = TEXT.sub[lang];
document.getElementById("startBtn").textContent = TEXT.get[lang];

//==================== START FLOW ====================//
function startFlow(){
    const t1 = localStorage.getItem("cozy_task1");
    const t2 = localStorage.getItem("cozy_task2");

    if(!t1) return location.href = "task1/index.html";
    if(!t2) return location.href = "task2/index.html";

    location.href = "getkey.html";
}
</script>

</body>
</html>
