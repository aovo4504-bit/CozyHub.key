<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cozy Hub</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/lang.js"></script>
<script src="assets/config.js"></script>
</head><body>
<div class="bg"></div><canvas id="stars"></canvas>
<div class="card">
  <div class="logo"></div>
  <div class="title" data-i18n="cozyhub">Cozy Hub</div>
  <div class="sub" data-i18n="subtitle_home">Click below to complete missions and get your key.</div>

  <select class="select" onchange="applyLang(this.value)">
    <option value="en" selected>English</option>
    <option value="vi">Tiếng Việt</option>
    <option value="th">ไทย</option>
    <option value="id">Indonesia</option>
    <option value="ph">Filipino</option>
    <option value="es">Español</option>
    <option value="pt">Português</option>
    <option value="fr">Français</option>
    <option value="de">Deutsch</option>
    <option value="ru">Русский</option>
    <option value="tr">Türkçe</option>
    <option value="ar">العربية</option>
  </select>

  <button class="btn" onclick="location.href=COZY.api.verify1" data-i18n="get_key">Get Key</button>

  <div class="icons">
    <a href="https://www.youtube.com/@VoAo-v2g" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png"></a>
    <a href="https://www.tiktok.com/@cozyhub15" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png"></a>
    <a href="https://discord.gg/" target="_blank"><img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png"></a>
  </div>

  <div class="small"></div>
</div>
<script>applyLang("en");</script>
<script src="assets/stars.js"></script>
</body></html>
