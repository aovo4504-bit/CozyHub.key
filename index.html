<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CozyHub</title>

<style>
    body {
        margin: 0;
        font-family: 'Poppins', sans-serif;
        background: #050811;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .card {
        width: 350px;
        background: rgba(10, 15, 25, 0.85);
        padding: 30px 25px;
        border-radius: 24px;
        text-align: center;
        border: 1px solid rgba(0,255,255,0.25);
        box-shadow: 0 0 40px rgba(0,255,255,0.25);
    }

    .logo {
        width: 110px;
        height: 110px;
        margin: 0 auto 10px;
        border-radius: 50%;
        background: url('https://raw.githubusercontent.com/aovo4504-bit/Cozyhub/refs/heads/main/IMG_0830.png') center/cover;
        filter: drop-shadow(0 0 15px #00eaff);
    }

    .title {
        font-size: 30px;
        margin-bottom: 10px;
        color: #00eaff;
        font-weight: 600;
        text-shadow: 0 0 12px rgba(0,255,255,0.6);
    }

    .sub {
        font-size: 14px;
        opacity: 0.8;
        margin-bottom: 20px;
    }

    .btn {
        width: 100%;
        padding: 12px 0;
        border-radius: 12px;
        border: none;
        background: #00eaff;
        color: #001015;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 0 18px rgba(0,255,255,0.55);
        transition: 0.25s;
    }

    .btn:hover {
        transform: scale(1.03);
        box-shadow: 0 0 25px rgba(0,255,255,0.8);
    }

    /* ==== ICON GROUP ==== */
    .icons {
        margin-top: 18px;
        display: flex;
        justify-content: center;
        gap: 22px;
        position: relative;
    }

    /* ==== ICON VIP ULTRA ==== */
    .icons a {
        position: relative;
        display: inline-block;
    }

    .icons img {
        width: 46px;
        height: 46px;
        cursor: pointer;

        filter:
            drop-shadow(0 0 10px rgba(0,255,255,0.6))
            drop-shadow(0 0 20px rgba(0,180,255,0.45))
            drop-shadow(0 0 35px rgba(0,120,255,0.35));

        animation: ultraBreath 3s infinite ease-in-out;
        transition: 0.25s;
    }

    /* Hover VIP ULTRA */
    .icons img:hover {
        transform: scale(1.25) rotate(2deg);

        filter:
            drop-shadow(0 0 15px rgba(0,255,255,1))
            drop-shadow(0 0 30px rgba(0,180,255,0.9))
            drop-shadow(0 0 55px rgba(0,120,255,0.8));

        animation: ultraShake 0.28s ease, shineEffect 0.8s ease-out;
    }

    /* Aura xoay */
    .icons a::before {
        content: "";
        position: absolute;
        top: -10px;
        left: -10px;
        width: 65px;
        height: 65px;
        border-radius: 50%;
        background: radial-gradient(
            circle,
            rgba(0,255,255,0.35),
            rgba(0,180,255,0.20),
            transparent 70%
        );
        filter: blur(15px);
        pointer-events: none;
        animation: rotateAura 6s linear infinite;
    }

    @keyframes ultraBreath {
        0% {
            filter:
                drop-shadow(0 0 7px rgba(0,255,255,0.4))
                drop-shadow(0 0 18px rgba(0,180,255,0.3))
                drop-shadow(0 0 28px rgba(0,120,255,0.2));
        }
        50% {
            filter:
                drop-shadow(0 0 15px rgba(0,255,255,0.9))
                drop-shadow(0 0 30px rgba(0,180,255,0.7))
                drop-shadow(0 0 45px rgba(0,120,255,0.55));
        }
        100% {
            filter:
                drop-shadow(0 0 7px rgba(0,255,255,0.4))
                drop-shadow(0 0 18px rgba(0,180,255,0.3))
                drop-shadow(0 0 28px rgba(0,120,255,0.2));
        }
    }

    @keyframes ultraShake {
        0% { transform: scale(1.15) rotate(0deg); }
        25% { transform: scale(1.23) rotate(2deg); }
        50% { transform: scale(1.20) rotate(-1deg); }
        75% { transform: scale(1.25) rotate(1deg); }
        100% { transform: scale(1.22) rotate(0deg); }
    }

    @keyframes rotateAura {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    @keyframes shineEffect {
        0% {
            filter: brightness(1.4)
                drop-shadow(0 0 22px rgba(0,255,255,1));
        }
        100% {
            filter: brightness(1)
                drop-shadow(0 0 10px rgba(0,255,255,0.5));
        }
    }
</style>
</head>


<body>

<div class="card">

    <div class="logo"></div>

    <div class="title">Cozy Hub</div>

    <div class="sub" id="subText">
        Bấm nút bên dưới để làm nhiệm vụ và nhận Key.
    </div>

    <button class="btn" onclick="startFlow()">
        Get Key
    </button>

    <div class="icons">
        <a href="https://www.youtube.com/@VoAo-v2g" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
        </a>

        <a href="https://www.tiktok.com/@cozyhub15" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png">
        </a>

        <a href="https://discord.gg/YOUR_INVITE" target="_blank">
            <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png">
        </a>
    </div>

</div>

<script>
// ===============================
// CONFIG
// ===============================
const LINK_TASK1 = "https://link4m.com/uAz8UdV";  
const LINK_TASK2 = "https://linkvertise.com/1457968/xB7L2G1JCt6E?o=sharing";
const RESET_HOURS = 24;

// ===============================
// RESET 24H
// ===============================
(function checkReset24h() {
    const lastDone = localStorage.getItem("cozy_task_done_at");
    if (lastDone) {
        const diff = Date.now() - Number(lastDone);
        if (diff >= RESET_HOURS * 60 * 60 * 1000) {
            localStorage.removeItem("cozy_task1");
            localStorage.removeItem("cozy_task2");
            localStorage.removeItem("cozy_task_done_at");
        }
    }
})();

// ===============================
// FLOW
// ===============================
function startFlow() {
    const t1 = localStorage.getItem("cozy_task1");
    const t2 = localStorage.getItem("cozy_task2");

    if (!t1) window.location.href = LINK_TASK1;
    else if (t1 === "done" && !t2) window.location.href = LINK_TASK2;
    else window.location.href = "getkey.html";
}

// ===============================
// UI update
// ===============================
window.onload = () => {
    const t1 = localStorage.getItem("cozy_task1");
    const t2 = localStorage.getItem("cozy_task2");
    const sub = document.getElementById("subText");

    if (!t1)
        sub.textContent = "Bấm để làm nhiệm vụ 1 trước khi nhận key.";
    else if (t1 && !t2)
        sub.textContent = "Bạn đã hoàn thành nhiệm vụ 1 – tiếp tục nhiệm vụ 2.";
    else {
        sub.textContent = "Bạn đã hoàn thành tất cả nhiệm vụ – bấm để nhận Key.";
        if (!localStorage.getItem("cozy_task_done_at")) {
            localStorage.setItem("cozy_task_done_at", Date.now());
        }
    }
};
</script>

</body>
</html>
