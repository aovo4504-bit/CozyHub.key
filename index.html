<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cozy Hub</title>
<style>
  :root{--bg:#04060d;--glow:#00e5ff;--card:#070b17cc;--txt:#eaf6ff;}
  *{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI,Roboto,Poppins,sans-serif}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% 35%, #061a22 0%, var(--bg) 55%, #02030a 100%);color:var(--txt);overflow:hidden}
  .dots{position:fixed;inset:0;pointer-events:none;opacity:.9}
  .dot{position:absolute;width:6px;height:6px;border-radius:999px;background:rgba(0,229,255,.65);filter:drop-shadow(0 0 10px rgba(0,229,255,.7))}
  .card{width:min(420px,92vw);padding:28px 26px;border-radius:22px;background:linear-gradient(180deg, #070b17cc, #070b17a8);border:1px solid rgba(0,229,255,.22);box-shadow:0 0 0 1px rgba(0,229,255,.10), 0 0 60px rgba(0,229,255,.18);text-align:center;backdrop-filter: blur(12px)}
  .logo{width:92px;height:92px;margin:0 auto 10px;border-radius:999px;background:url("https://i.imgur.com/5fX9y5m.png") center/cover;box-shadow:0 0 25px rgba(0,229,255,.35), 0 0 0 2px rgba(0,229,255,.18)}
  .title{font-size:34px;font-weight:800;letter-spacing:.3px;color:var(--glow);text-shadow:0 0 18px rgba(0,229,255,.35)}
  .sub{margin:10px 0 18px;opacity:.92}
  .btn{width:100%;padding:14px 16px;border:none;border-radius:14px;background:linear-gradient(90deg,#00e5ff,#00b7ff);color:#001018;font-weight:800;cursor:pointer;box-shadow:0 14px 35px rgba(0,229,255,.25);transition:.18s}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.05)}
  .icons{display:flex;justify-content:center;gap:18px;margin-top:18px}
  .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(255,255,255,.04);border:1px solid rgba(0,229,255,.18);box-shadow:0 0 26px rgba(0,229,255,.12);transition:.18s;position:relative;overflow:hidden}
  .ic:before{content:"";position:absolute;inset:-60%;background:radial-gradient(circle at 30% 30%, rgba(0,229,255,.22), transparent 55%);transform:rotate(25deg)}
  .ic:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 40px rgba(0,229,255,.22)}
  .ic img{width:26px;height:26px;filter:drop-shadow(0 0 10px rgba(0,229,255,.25))}
</style>
</head>
<body>
<div class="dots" id="dots"></div>

<div class="card">
  <div class="logo"></div>
  <div class="title">Cozy Hub</div>
  <div class="sub" id="sub">Click the button below to complete missions and get your key.</div>

  <button class="btn" id="go">Get Key</button>

  <div class="icons">
    <a class="ic" href="https://www.youtube.com/@VoAo-v2g" target="_blank" rel="noreferrer">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
    </a>
    <a class="ic" href="https://www.tiktok.com/@cozyhub15" target="_blank" rel="noreferrer">
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png">
    </a>
    <a class="ic" href="https://discord.gg/" target="_blank" rel="noreferrer">
      <img src="https://cdn-icons-png.flaticon.com/512/2111/2111370.png">
    </a>
  </div>
</div>

<script>
  // English default, other languages supported
  const langRaw=(navigator.language||"en").toLowerCase();
  const lang = (langRaw.startsWith("vi")?"vi":langRaw.startsWith("th")?"th":langRaw.startsWith("id")?"id":(langRaw.startsWith("fil")||langRaw.startsWith("ph")||langRaw.startsWith("tl"))?"ph":"en");
  const TEXT={
    sub:{en:"Click the button below to complete missions and get your key.",vi:"Bấm nút bên dưới để làm nhiệm vụ và nhận key.",th:"คลิกปุ่มด้านล่างเพื่อทำภารกิจและรับคีย์",id:"Klik tombol di bawah untuk menyelesaikan misi dan mendapatkan key.",ph:"I-click ang button sa ibaba para tapusin ang tasks at makuha ang key."},
    btn:{en:"Get Key",vi:"Nhận Key",th:"รับคีย์",id:"Dapatkan Key",ph:"Kunin ang Key"}
  };
  document.getElementById("sub").textContent = TEXT.sub[lang];
  document.getElementById("go").textContent = TEXT.btn[lang];

  // reset missions every 10 minutes (web layer)
  const RESET_MS = 10*60*1000;
  const t = parseInt(localStorage.getItem("cozy_reset_at")||"0",10);
  if(!t || Date.now()-t>RESET_MS){
    localStorage.setItem("cozy_reset_at", String(Date.now()));
    localStorage.removeItem("cozy_task1");
    localStorage.removeItem("cozy_task2");
  }

  document.getElementById("go").onclick = ()=> location.href = "https://aovo4504-bit.github.io/task1/index.html";

  // dots background
  const dots=document.getElementById("dots");
  for(let i=0;i<35;i++){
    const d=document.createElement("div");
    d.className="dot";
    d.style.left = (Math.random()*100)+"%";
    d.style.top = (Math.random()*100)+"%";
    d.style.opacity = (0.35+Math.random()*0.65);
    d.style.transform = `scale(${0.6+Math.random()*1.4})`;
    dots.appendChild(d);
  }
</script>
</body>
</html>
