<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cozy Hub</title>

<style>
body {
  margin: 0;
  font-family: Poppins, sans-serif;
  background: linear-gradient(135deg, #000814, #001d3d);
  height: 100vh;
  overflow: hidden;
  color: white;
}

/* BACKGROUND ANIMATION */
.bg {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, #002855 0%, #001233 50%, #000814 100%);
  animation: float 10s infinite alternate ease-in-out;
  z-index: -1;
}
@keyframes float {
  from { transform: translateY(-10px); }
  to   { transform: translateY(10px); }
}

/* CONTAINER */
.card {
  width: 420px;
  max-width: 92vw;
  margin: 120px auto;
  background: rgba(255,255,255,0.05);
  padding: 40px 30px;
  border-radius: 24px;
  text-align: center;
  backdrop-filter: blur(8px);
  box-shadow: 0 0 30px #00e5ff55;
  border: 1px solid #00eaff33;
}

/* LOGO */
.logo {
  width: 110px;
  height: 110px;
  margin: 0 auto 20px;
  border-radius: 50%;
  background: url("https://raw.githubusercontent.com/aovo4504-bit/Cozyhub/refs/heads/main/IMG_0830.png") center/cover;
  box-shadow: 0 0 20px #00eaffaa;
}

/* TITLE */
.title {
  font-size: 34px;
  font-weight: 700;
  margin-bottom: 10px;
  text-shadow: 0 0 20px #00eaff;
}

/* SUBTEXT */
.desc {
  opacity: 0.85;
  margin-bottom: 22px;
  font-size: 15px;
}

/* BUTTON */
.btn {
  width: 100%;
  padding: 14px;
  border-radius: 10px;
  background: #00eaff;
  color: #00141a;
  font-size: 18px;
  border: none;
  cursor: pointer;
  font-weight: 700;
  box-shadow: 0 0 18px #00eaffaa;
  transition: 0.25s;
}
.btn:hover {
  transform: scale(1.05);
}

/* ICONS */
.icons {
  margin-top: 28px;
  display: flex;
  justify-content: center;
  gap: 22px;
}
.icons img {
  width: 36px;
  filter: drop-shadow(0 0 8px #00eaffaa);
  transition: 0.25s;
}
.icons img:hover {
  transform: scale(1.2);
}
</style>
</head>
<body>

<div class="bg"></div>

<div class="card">
  <div class="logo"></div>

  <div class="title">Cozy Hub</div>
  <div class="desc">
    Complete 2 missions to receive your key.
  </div>

  <button class="btn" onclick="startMission()">Start Mission</button>

  <div class="icons">
    <a href="https://www.youtube.com/@VoAo-v2g" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png">
    </a>
    <a href="https://www.tiktok.com/@cozyhub15" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png">
    </a>
    <a href="https://discord.com" target="_blank">
      <img src="https://cdn-icons-png.flaticon.com/512/3670/3670157.png">
    </a>
  </div>
</div>

<script>
function startMission() {
  localStorage.removeItem("cozy_task2");
  localStorage.removeItem("cozy_task1");
  location.href = "https://direct-link.net/1457968/wqITOYXxDOMd";
}
</script>

</body>
</html>
